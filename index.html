<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F04A16">
  <meta name="application-name" content="MplusKASSA Verwaltung">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MplusKASSA">
  <title>MplusKASSA Verwaltung</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <style>
    :root {
      color-scheme: light;
      --orange:#F04A16;
      --text:#161616;
      --muted:#6b7280;
      --bg:#f6f7f9;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; min-height:100%; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }
    body {
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
    }
    .launcher {
      width:min(420px,100%);
      text-align:center;
    }
    .icon {
      width:132px;
      height:132px;
      margin:0 auto 20px;
      border-radius:28px;
      box-shadow:0 18px 45px rgba(0,0,0,.16);
    }
    h1 { margin:0 0 6px; font-size:25px; }
    p { margin:0 0 22px; color:var(--muted); line-height:1.5; }
    .bar {
      height:6px;
      border-radius:999px;
      background:#e5e7eb;
      overflow:hidden;
      margin:0 auto 18px;
    }
    .bar > span {
      display:block;
      height:100%;
      width:35%;
      border-radius:inherit;
      background:var(--orange);
      animation:loading 1.1s ease-in-out infinite alternate;
    }
    @keyframes loading {
      from { transform:translateX(-20%); }
      to { transform:translateX(210%); }
    }
    a {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      padding:0 18px;
      border-radius:10px;
      background:var(--orange);
      color:#fff;
      font-weight:700;
      text-decoration:none;
    }
    small {
      display:block;
      margin-top:14px;
      color:#9ca3af;
    }
  </style>
</head>

<body>
  <main class="launcher">
    <img class="icon" src="icons/icon-192.png" alt="MplusKASSA Verwaltung">
    <h1>MplusKASSA Verwaltung</h1>
    <p>Verwaltung Deutschland wird geöffnet …</p>
    <div class="bar"><span></span></div>

    <a id="openButton" href="https://script.google.com/macros/s/AKfycbyGVPiNk2--IrkN33Mi7etv9LZ8iFQk-kykct0eG8-zJuh9Icr4R3n7hlHFQgcA17TMyQ/exec">
      Verwaltung öffnen
    </a>

    <small>Falls die Weiterleitung nicht automatisch startet, tippe auf „Verwaltung öffnen“.</small>
  </main>

  <script>
    const TARGET_URL = "https://script.google.com/macros/s/AKfycbyGVPiNk2--IrkN33Mi7etv9LZ8iFQk-kykct0eG8-zJuh9Icr4R3n7hlHFQgcA17TMyQ/exec";

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.warn);
      });
    }

    // Kurzer Launcher, damit Chrome zunächst die installierte PWA mit eigenem Icon startet.
    window.setTimeout(() => {
      window.location.replace(TARGET_URL);
    }, 900);
  </script>
</body>
</html>
